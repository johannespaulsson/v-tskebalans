<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vätskebalans IVA Skövde – Upphörd</title>
    <style>
        :root {
            --bg-body: #f4f6f8;
            --bg-card: #ffffff;
            --text-main: #1f2937;
            --text-muted: #4b5563;
            --border-color: #e5e7eb;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #111827;
                --bg-card: #1f2937;
                --text-main: #f9fafb;
                --text-muted: #d1d5db;
                --border-color: #374151;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            max-width: 560px;
            width: 100%;
            padding: 36px 32px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            font-size: 22px;
            line-height: 1.45;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 14px;
        }

        .sub {
            font-size: 14px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <main class="card" role="main">
        <h1>Denna mjukvara för vätskebalansräkning har upphört, all vätskebalansräkning sker i CHA</h1>
        <p class="sub">Vätskebalans IVA Skövde</p>
    </main>
</body>
</html>
